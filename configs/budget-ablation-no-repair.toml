# Pilot ablation bỏ retrieval repair, tái dùng frozen gold/calibration của baseline.

[run]
name = "budget-ablation-no-repair-20"
seed = 20260921
split = "test"
dev_size = 200
calibration_size = 200
test_size = 600
max_samples = 20
calibration_max_samples = 10
stratified_subset = true
publish_acceptance = false
bootstrap_iterations = 1000
max_concurrency = 1
checkpoint_every = 1

[datasets]
ragrouter_path = "data/raw/ragrouter/questions.jsonl"
ragrouter_sample_size = 700
crag_path = "data/raw/crag/questions.jsonl"
crag_sample_size = 300
mock_web_path = "data/raw/crag/mock_web.jsonl"

[retrieval]
vector_top_k = 12
evidence_limit = 8
max_repair_rounds = 2
web_provider = "mock"

[generation]
max_output_tokens = 512

[counterfactual]
quality_floor = 0.70

[replay]
source_run_id = "budget-pilot-2-79"

[ablation]
context_gate_enabled = true
repair_enabled = false
strong_fallback_enabled = true

[cost_budget]
limit_usd = 0.45
provider_ledger_path = "artifacts/benchmarks/provider-cost-budget.json"
deepseek_limit_usd = 2.79
jev_limit_usd = 3.00
counterfactual_reserve_usd = 0.10
adaptive_reserve_usd = 0.10
jev_reserve_usd = 0.01

[acceptance]
quality_non_inferiority_margin = 0.02
minimum_cost_reduction = 0.20
minimum_p50_latency_reduction = 0.15
maximum_p95_latency_regression = 0.05
critical_recall = 0.90
maximum_ece = 0.08
maximum_unhandled_error_rate = 0.005
